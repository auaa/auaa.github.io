<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>auaa daily — API 验证</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ee;
        --ink: #1c1917;
        --muted: #78716c;
        --ok: #166534;
        --bad: #991b1b;
        --card: #fffefb;
        --line: #e7e5e4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #dde8df 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #e8ddd3 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
        min-height: 100vh;
        padding: 24px 16px 48px;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 650;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 24px;
        line-height: 1.5;
        font-size: 0.95rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .label {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .ok {
        color: var(--ok);
        font-weight: 600;
      }
      .bad {
        color: var(--bad);
        font-weight: 600;
      }
      pre {
        margin: 12px 0 0;
        padding: 12px;
        background: #1c1917;
        color: #fafaf9;
        border-radius: 8px;
        overflow: auto;
        font-size: 0.75rem;
        line-height: 1.45;
        max-height: 360px;
      }
      button {
        appearance: none;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: #fff;
        border-radius: 999px;
        padding: 10px 18px;
        font: inherit;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GitHub API 最小验证</h1>
      <p class="sub">
        Phase 0：从本页加载 <code>config.json</code>，请求 Contents API，确认 CORS / 鉴权 /
        路径是否可用。
      </p>
      <div class="card">
        <div class="row">
          <span class="label">配置</span>
          <span id="cfgStatus">未开始</span>
        </div>
        <div class="row">
          <span class="label">无 Token 读公开目录</span>
          <span id="publicStatus">未开始</span>
        </div>
        <div class="row">
          <span class="label">带 Token 读目录</span>
          <span id="authStatus">未开始</span>
        </div>
        <button id="runBtn" type="button">重新检测</button>
      </div>
      <div class="card">
        <div class="label">详情</div>
        <pre id="log">等待检测…</pre>
      </div>
    </main>
    <script>
      const logEl = document.getElementById("log");
      const lines = [];

      function setStatus(id, ok, text) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = ok === null ? "" : ok ? "ok" : "bad";
      }

      function log(msg) {
        lines.push(typeof msg === "string" ? msg : JSON.stringify(msg, null, 2));
        logEl.textContent = lines.join("\n\n");
      }

      async function loadConfig() {
        const res = await fetch("./config.json", { cache: "no-store" });
        if (!res.ok) throw new Error("config.json HTTP " + res.status);
        return res.json();
      }

      async function listContents({ owner, repo, dataPath, token }) {
        const url =
          "https://api.github.com/repos/" +
          encodeURIComponent(owner) +
          "/" +
          encodeURIComponent(repo) +
          "/contents/" +
          dataPath.replace(/^\/+|\/+$/g, "");
        const headers = {
          Accept: "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
        };
        if (token) headers.Authorization = "Bearer " + token;
        const res = await fetch(url, { headers });
        const text = await res.text();
        let body;
        try {
          body = JSON.parse(text);
        } catch {
          body = text;
        }
        return { url, status: res.status, ok: res.ok, body };
      }

      async function run() {
        const btn = document.getElementById("runBtn");
        btn.disabled = true;
        lines.length = 0;
        setStatus("cfgStatus", null, "检测中…");
        setStatus("publicStatus", null, "检测中…");
        setStatus("authStatus", null, "检测中…");
        logEl.textContent = "检测中…";

        let cfg;
        try {
          cfg = await loadConfig();
          const g = cfg.github || {};
          setStatus(
            "cfgStatus",
            true,
            g.owner + "/" + g.repo + " @ " + (g.branch || "main")
          );
          log({ configLoaded: true, github: { ...g, token: g.token ? "(set)" : "(empty)" } });
        } catch (e) {
          setStatus("cfgStatus", false, String(e.message || e));
          log(String(e.stack || e));
          btn.disabled = false;
          return;
        }

        const g = cfg.github;
        const base = {
          owner: g.owner,
          repo: g.repo,
          dataPath: g.dataPath || "data",
        };

        try {
          const pub = await listContents({ ...base, token: "" });
          setStatus(
            "publicStatus",
            pub.ok,
            pub.ok ? "CORS + 公开读 OK (" + pub.status + ")" : "失败 " + pub.status
          );
          log({ step: "public", ...pub });
        } catch (e) {
          setStatus("publicStatus", false, "可能 CORS/网络: " + (e.message || e));
          log(String(e.stack || e));
        }

        if (!g.token) {
          setStatus("authStatus", false, "config.token 为空，跳过");
          log("填写 Fine-grained PAT 到 docs/config.json 后重新检测带 Token 读取。");
        } else {
          try {
            const auth = await listContents({ ...base, token: g.token });
            setStatus(
              "authStatus",
              auth.ok,
              auth.ok ? "鉴权读 OK (" + auth.status + ")" : "失败 " + auth.status
            );
            log({ step: "authed", ...auth });
          } catch (e) {
            setStatus("authStatus", false, "可能 CORS/网络: " + (e.message || e));
            log(String(e.stack || e));
          }
        }

        btn.disabled = false;
      }

      document.getElementById("runBtn").addEventListener("click", run);
      run();
    </script>
  </body>
</html>
